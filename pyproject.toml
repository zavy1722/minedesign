[project]
name = "face3d"
version = "0.1.0"
description = "Photo-to-3D face fitting engine and Blender add-on, grounded in facial anatomy research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
